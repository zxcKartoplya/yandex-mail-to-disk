name: Build Windows

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Tests
        run: python -m pytest -q

      - name: Task Scheduler accepts the task
        shell: pwsh
        env:
          MAIL2DISK_HOME: ${{ runner.temp }}\m2d
        run: |
          python -c "from mail2disk.scheduler import install, is_installed, uninstall; print(install(9, 0)); assert is_installed(); print(uninstall()); assert not is_installed()"

      - name: Build exe
        run: pyinstaller --onefile --console --clean --noconfirm --specpath build --workpath build --name YandexMailToDisk "${{ github.workspace }}\run.py"

      - name: Smoke test exe
        shell: pwsh
        env:
          MAIL2DISK_HOME: ${{ runner.temp }}\m2d-exe
        run: |
          .\dist\YandexMailToDisk.exe --version
          .\dist\YandexMailToDisk.exe --status
          .\dist\YandexMailToDisk.exe --run
          if ($LASTEXITCODE -ne 2) { throw "expected exit code 2 without config, got $LASTEXITCODE" }
          exit 0

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package | Out-Null
          Copy-Item dist\YandexMailToDisk.exe package\
          Copy-Item "ИНСТРУКЦИЯ.md" "package\ИНСТРУКЦИЯ.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: YandexMailToDisk-windows
          path: package/
